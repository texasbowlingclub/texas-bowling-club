<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule &amp; Results | Texas Bowling Club</title>
  <meta name="description" content="Texas Bowling Club tournament schedule, team results, and individual averages.">
  <link rel="stylesheet" href="athletics.css">

  <style>
    .tournament-row {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr) 220px;
      align-items: center;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid #dedbd8;
    }

    .tournament-row h3,
    .tournament-row p {
      margin: 0;
    }

    .tournament-row h3 {
      margin-bottom: 6px;
    }

    .tournament-row h3 a {
      color: #a63a11;
      text-underline-offset: 4px;
    }

    .tournament-row p {
      color: #625a54;
    }

    .team-placement {
      text-align: right;
      font-weight: 700;
      line-height: 1.8;
    }

    .team-placement span {
      display: block;
    }

    .result-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin: 24px 0 32px;
    }

    .result-card {
      padding: 24px;
      background: #f4f2ef;
      border-top: 4px solid #a63a11;
    }

    .result-card h2 {
      margin-bottom: 12px;
      font-size: 1.35rem;
    }

    .result-card p {
      margin: 4px 0;
    }

    .placing {
      font-size: 2rem;
      font-weight: 800;
      color: #a63a11;
    }

    .results-section {
      margin-top: 32px;
    }

    .results-section h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .results-table caption {
      text-align: left;
      font-weight: 700;
      padding-bottom: 12px;
    }

    .results-table th,
    .results-table td {
      padding: 12px;
      border-bottom: 1px solid #dedbd8;
      white-space: nowrap;
    }

    .results-table thead {
      background: #252321;
      color: white;
    }

    .results-table tbody tr:nth-child(even) {
      background: #f4f2ef;
    }

    .results-table .number {
      text-align: right;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #a63a11;
      font-weight: 700;
    }

    .source-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin: 28px 0;
    }

    .source-links a {
      color: #a63a11;
      font-weight: 700;
    }

    .result-note {
      color: #625a54;
      font-size: 0.9rem;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      .tournament-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .team-placement {
        text-align: left;
      }

      .result-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      <section class="schedule-group" aria-labelledby="completed-title">

        <div id="completed-events"></div>

    </div>

    <div id="tournament-view" hidden>
      <a class="back-link" href="schedule.html">

    function scheduleEntry(tournament) {
      const placement = tournament.completed
        ? `
          <span>Men’s Team · ${tournament.men.place}</span>
          <span>Women’s Team · ${tournament.women.place}</span>
        `
        : '<span class="tag">Upcoming</span>';

      return `
        <article class="tournament-row" id="${tournament.anchor}">
          <strong>${tournament.date}</strong>
          <div>
            <h3>
              <a href="schedule.html?tournament=${tournament.slug}">
                ${tournament.name}
              </a>
            </h3>
            <p>${tournament.venue}</p>
          </div>
          <div class="team-placement">${placement}</div>
        </article>
      `;
    }

    function teamSummary(label, team) {
      return `
        <section class="result-card">
          <h2>${label} Team</h2>
          <p class="placing">${team.place} Place</p>
          <p>Team-game pins · ${team.teamPins.toLocaleString("en-US")}</p>
          <p>Baker pins · ${team.bakerPins.toLocaleString("en-US")}</p>
          <p><strong>Total pins · ${team.totalPins.toLocaleString("en-US")}</strong></p>
        </section>
      `;
    }

    function averagesTable(label, team) {
      const rows = team.bowlers.map(bowler => `
        <tr>
          <td class="number">${bowler.rank}</td>
          <th scope="row">${bowler.name}</th>
          <td class="number">${bowler.games}</td>
          <td class="number">${bowler.pins.toLocaleString("en-US")}</td>
          <td class="number">${bowler.average}</td>
        </tr>
      `).join("");

      return `
        <div class="table-scroll">
          <table class="results-table">
            <caption>${label}</caption>
            <thead>
              <tr>
                <th scope="col" class="number">USBC Rank</th>
                <th scope="col">Bowler</th>
                <th scope="col" class="number">Games</th>
                <th scope="col" class="number">Total Pins</th>
                <th scope="col" class="number">Individual Average</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    const upcomingEvents = tournaments.filter(t => !t.completed);
    const completedEvents = tournaments.filter(t => t.completed);

    document.getElementById("upcoming-events").innerHTML =
      upcomingEvents.map(scheduleEntry).join("");

    document.getElementById("completed-events").innerHTML =
      completedEvents.map(scheduleEntry).join("");

    const selectedSlug = new URLSearchParams(window.location.search)
      .get("tournament");

    const selectedTournament = tournaments.find(
      tournament => tournament.slug === selectedSlug
    );

    if (selectedTournament) {
      document.getElementById("schedule-view").hidden = true;
      document.getElementById("tournament-view").hidden = false;

      document.title =
        selectedTournament.name + " | Texas Bowling Club";

      document.getElementById("tournament-title").textContent =
        selectedTournament.name;

      document.getElementById("tournament-date").textContent =
        selectedTournament.date;

      document.getElementById("tournament-venue").textContent =
        selectedTournament.venue;

      const results = document.getElementById("tournament-results");

      if (selectedTournament.completed) {
        const sourcePath =
          "29/" +
          selectedTournament.eventId + "/" +
          encodeURIComponent(selectedTournament.name) +
          "/2026-2027/";

        const standingsUrl =
          "https://collegebowling.bowl.com/teamStandings/" + sourcePath;

        const averagesUrl =
          "https://collegebowling.bowl.com/eventAverage/" + sourcePath;

        results.innerHTML = `
          <p><strong>Format</strong> · ${selectedTournament.format}</p>

          <div class="result-summary">
            ${teamSummary("Men’s", selectedTournament.men)}
            ${teamSummary("Women’s", selectedTournament.women)}
          </div>

          <section class="results-section">
            <h2>Individual Averages</h2>
            <p class="result-note">
              Rankings are the positions published by USBC within
              each men’s or women’s event listing. Averages are
              rounded to two decimal places.
            </p>

            ${averagesTable("Men’s Individual Averages", selectedTournament.men)}
            <br>
            ${averagesTable("Women’s Individual Averages", selectedTournament.women)}
          </section>

          <nav class="source-links" aria-label="Official USBC results">
            <a href="${standingsUrl}true" target="_blank" rel="noopener">
              Men’s Team Standings
            </a>
            <a href="${standingsUrl}false" target="_blank" rel="noopener">
              Women’s Team Standings
            </a>
            <a href="${averagesUrl}true" target="_blank" rel="noopener">
              Men’s Individual Results
            </a>
            <a href="${averagesUrl}false" target="_blank" rel="noopener">
              Women’s Individual Results
            </a>
          </nav>
        `;
      } else {
        results.innerHTML = `
          <section class="results-section">
            <h2>Results Pending</h2>
            <p>
              Team placements and individual averages will be
              posted after the tournament.
            </p>
          </section>
        `;
